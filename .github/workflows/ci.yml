name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -v --cov=ingest --cov=index --cov=retrieve --cov=generate --cov=eval --cov-report=xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  eval:
    # Retrieval eval over the frozen corpus in eval/fixtures/: fails the build
    # if recall@5 drops below the floor. Retrieval only -- no model calls, no
    # API key, no cost. Citations run from eval-citations.yml on demand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: Retrieval eval
        run: |
          set -o pipefail
          python -m eval.run --retrieval-only --min-recall 0.9 | tee eval.txt

      - name: Publish the scores
        if: always()
        run: |
          {
            echo "### Retrieval eval (frozen corpus)"
            echo '```'
            grep -E '^(  |latest|lookup|all|recall|FAIL)' eval.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
