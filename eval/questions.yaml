# Hand-written questions over the frozen corpus in eval/fixtures/articles.jsonl
# (snapshot time in eval/fixtures/manifest.json). Each one was written from the
# article it points at, and phrased the way someone would ask it rather than by
# echoing the title, so retrieval has to match meaning, not headline words.
#
# kind: lookup  -- a fact from one specific article, of any age. Recency
#                  weighting can only hurt these: an older article has to beat
#                  newer, loosely related ones.
# kind: latest  -- "what's the newest X", where the corpus holds an older,
#                  near-identical article as a distractor (rustup 1.29.2 vs
#                  1.29.3, Rust 1.99.0 vs 1.99.1, ...). Only the newer one is
#                  correct, so recall@1 is the number that matters here: a
#                  top-5 that holds both is not an answer.
#
# Several lookups are deliberately hard: the expected article sits among
# near-neighbours (Memory QoS vs the cgroup v2 post, the two SIMD posts, C
# variadics in Rust 1.99.0 vs the variadic generics survey, the two Cargo team
# announcements, eMudhra in the Go blog vs rustup 1.29.2).
#
# Re-snapshotting the corpus replaces these articles -- rewrite this file
# against the new snapshot in the same change.
questions:
  # --- Kubernetes blog ---------------------------------------------------
  - question: "How many enhancements shipped in Kubernetes 1.37, and what is the release named after?"
    expected_article_id: "https://kubernetes.io/blog/2026/08/26/kubernetes-v1-37-release/"
